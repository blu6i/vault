[project]
name = "vault"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.32.0",
    "fastapi>=0.143.0",
    "loguru>=0.7.3",
    "pydantic>=2.14.0",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.15.1",
    "redis>=8.1.0",
    "sqlalchemy>=2.1.4",
    "uvicorn[standard]>=0.54.0",
    "zxcvbn>=4.5.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.0",
]


# ==============================================================================
# Конфигурация Ruff (Линтер и Форматтер)
# ==============================================================================
[tool.ruff]
target-version = "py314"
line-length = 90
exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    "alembic",
    "docs",
    "migrations",
    "tests",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # pyflakes
    "I",      # isort (сортировка импортов)
    "UP",     # pyupgrade (модернизация под Python 3.14)
    "FURB",   # refurb (рефакторинг устаревших конструкций)
    "C4",     # flake8-comprehensions
    "FAST",   # FastAPI best practices
    "DTZ",    # flake8-datetimez (запрет дат без timezone)
    "T20",    # flake8-print (запрет print)
    "ASYNC",  # flake8-async (проверки асинхронного кода)
    "D",      # pydocstyle (документация docstrings)
]
ignore = [
    "RUF001", # Символы, похожие на латиницу в строках
    "RUF002", # Символы, похожие на латиницу в docstrings
    "RUF003", # Символы, похожие на латиницу в комментариях
    "D203",   # Конфликт с D211 (1 пустая строка перед class docstring)
    "D212",   # Конфликт с D213 (docstring с первой строки)
]
fixable = ["ALL"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ==============================================================================
# Конфигурация Pytest
# ==============================================================================
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "-v"
