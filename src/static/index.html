<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vault Admin</title>
  <style>
    :root {
      --bg: #090d16;
      --card-bg: #111827;
      --border: #1f2937;
      --border-focus: #6366f1;
      --text: #f9fafb;
      --text-muted: #9ca3af;
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --danger: #ef4444;
      --danger-hover: #dc2626;
      --success: #10b981;
      --input-bg: #030712;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 2.5rem 1.5rem;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 1100px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .badge-logo {
      background: linear-gradient(135deg, #4f46e5, #06b6d4);
      color: white;
      padding: 0.35rem 0.65rem;
      border-radius: 6px;
      font-weight: 700;
      font-size: 0.85rem;
      letter-spacing: 0.05em;
    }

    h1 {
      font-size: 1.35rem;
      font-weight: 600;
    }

    /* 2-колоночный CSS Grid */
    .grid {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 1.5rem;
      align-items: start;
    }

    @media (max-width: 768px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1.5rem;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.2);
    }

    .card h2 {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 1rem;
    }

    .form-group {
      margin-bottom: 1rem;
    }

    label {
      display: block;
      margin-bottom: 0.4rem;
      font-size: 0.825rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    input[type="text"],
    input[type="email"],
    input[type="password"] {
      width: 100%;
      padding: 0.65rem 0.85rem;
      background-color: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 0.9rem;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    input:focus {
      outline: none;
      border-color: var(--border-focus);
      box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.2);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.65rem 1.25rem;
      font-size: 0.875rem;
      font-weight: 500;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .btn-primary {
      background-color: var(--primary);
      color: #fff;
      width: 100%;
    }

    .btn-primary:hover {
      background-color: var(--primary-hover);
    }

    .btn-action {
      background-color: var(--primary);
      color: #fff;
      width: auto;
    }

    .btn-action:hover {
      background-color: var(--primary-hover);
    }

    .btn-danger {
      background-color: rgba(239, 68, 68, 0.15);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.3);
      padding: 0.4rem 0.85rem;
    }

    .btn-danger:hover {
      background-color: var(--danger);
      color: white;
    }

    .alert {
      padding: 0.75rem 1rem;
      border-radius: 6px;
      margin-bottom: 1.25rem;
      font-size: 0.85rem;
      display: none;
    }

    .alert-error {
      background-color: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #fca5a5;
    }

    .alert-success {
      background-color: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: #6ee7b7;
    }

    /* Таблица */
    .table-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
    }

    .table-container {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.875rem;
    }

    th, td {
      padding: 0.75rem 0.85rem;
      border-bottom: 1px solid var(--border);
    }

    th {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      font-weight: 600;
    }

    tbody tr:hover {
      background-color: rgba(255, 255, 255, 0.02);
    }

    code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.8rem;
      color: #a5b4fc;
      background: rgba(99, 102, 241, 0.1);
      padding: 0.15rem 0.35rem;
      border-radius: 4px;
    }

    .badge {
      display: inline-block;
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 500;
    }

    .badge-confidential {
      background-color: rgba(99, 102, 241, 0.15);
      color: #c7d2fe;
      border: 1px solid rgba(99, 102, 241, 0.4);
    }

    .badge-public {
      background-color: rgba(107, 114, 128, 0.15);
      color: #d1d5db;
      border: 1px solid rgba(107, 114, 128, 0.4);
    }

    .empty-state {
      text-align: center;
      padding: 2.5rem 1rem;
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="brand">
        <span class="badge-logo">VAULT</span>
        <h1>Admin Dashboard</h1>
      </div>
      <div id="userHeader" class="hidden" style="display: flex; align-items: center; gap: 1rem;">
        <span id="userEmail" style="color: var(--text-muted); font-size: 0.875rem;"></span>
        <button id="logoutBtn" class="btn btn-danger">Выйти</button>
      </div>
    </header>

    <div id="alertBox" class="alert"></div>

    <div class="grid">
      <!-- Колонка 1: Блок аутентификации -->
      <section class="card">
        <div id="loginBlock">
          <h2>Вход</h2>
          <form id="loginForm">
            <div class="form-group">
              <label for="loginEmail">Email</label>
              <input type="email" id="loginEmail" required placeholder="admin@example.com">
            </div>
            <div class="form-group">
              <label for="loginPassword">Пароль</label>
              <input type="password" id="loginPassword" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn btn-primary">Войти</button>
          </form>
        </div>

        <div id="profileBlock" class="hidden">
          <h2>Сессия активна</h2>
          <p style="color: var(--text-muted); font-size: 0.875rem; margin-bottom: 1.25rem;">
            Вы вошли как <strong id="profileEmail" style="color: var(--text);"></strong>
          </p>
          <p style="font-size: 0.8rem; color: var(--text-muted); line-height: 1.4;">
            GraphQL-запросы отправляются с заголовком <br><code>Authorization: Bearer &lt;token&gt;</code>
          </p>
        </div>
      </section>

      <!-- Колонка 2: Таблица клиентов и создание -->
      <section class="card">
        <div class="table-header">
          <h2>OAuth-клиенты</h2>
          <button id="createClientBtn" class="btn btn-action hidden">+ Создать клиента</button>
        </div>

        <div id="clientsBlock" class="hidden table-container">
          <table>
            <thead>
              <tr>
                <th>ID</th>
                <th>Client ID</th>
                <th>Имя</th>
                <th>Тип</th>
                <th>Redirect URIs</th>
              </tr>
            </thead>
            <tbody id="clientsTableBody"></tbody>
          </table>
        </div>

        <div id="guestNotice" class="empty-state">
          Войдите в систему для просмотра и управления OAuth-клиентами.
        </div>
      </section>
    </div>
  </div>

  <script src="/admin/app.js"></script>
</body>
</html>
